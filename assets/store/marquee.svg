<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">TL;PR Chrome Web Store marquee</title>
  <desc id="desc">TL;PR branding with a stylized conversation folding into a compact center</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="40" x2="1328" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161B22"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#090C10"/>
    </linearGradient>
    <linearGradient id="accent" x1="286" y1="170" x2="390" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
  </defs>
  <rect width="1400" height="560" fill="url(#background)"/>
  <circle cx="336" cy="280" r="150" fill="#7C3AED" opacity="0.14" filter="url(#glow)"/>
  <g transform="translate(176 120)">
    <rect width="320" height="320" rx="80" fill="#0D1117"/>
    <rect x="2" y="2" width="316" height="316" rx="78" fill="none" stroke="#484F58" stroke-width="4"/>
    <rect x="62" y="72" width="196" height="24" rx="12" fill="#F0F6FC"/>
    <rect x="62" y="224" width="196" height="24" rx="12" fill="#F0F6FC"/>
    <circle cx="160" cy="142" r="20" fill="url(#accent)"/>
    <path d="M174 170c0 20-13 31-34 38" fill="none" stroke="url(#accent)" stroke-width="23" stroke-linecap="round"/>
  </g>
  <text x="610" y="260" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="112" font-weight="750" letter-spacing="-5">TL;PR</text>
  <text x="616" y="332" fill="#9DA7B3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="500">Long GitHub threads, folded</text>
  <g opacity="0.82">
    <rect x="1060" y="154" width="220" height="18" rx="9" fill="#F0F6FC"/>
    <rect x="1120" y="220" width="160" height="14" rx="7" fill="#8B949E"/>
    <circle cx="1082" cy="227" r="9" fill="#8B5CF6"/>
    <rect x="1148" y="276" width="132" height="14" rx="7" fill="#8B949E"/>
    <circle cx="1110" cy="283" r="9" fill="#22D3EE"/>
    <rect x="1060" y="342" width="220" height="18" rx="9" fill="#F0F6FC"/>
  </g>
</svg>
