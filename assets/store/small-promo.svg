<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">TL;PR Chrome Web Store promotional tile</title>
  <desc id="desc">The TL;PR mark beside a compact conversation motif on a dark gradient surface</desc>
  <defs>
    <linearGradient id="background" x1="32" y1="24" x2="408" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161B22"/>
      <stop offset="1" stop-color="#090C10"/>
    </linearGradient>
    <linearGradient id="accent" x1="131" y1="86" x2="185" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="440" height="280" fill="url(#background)"/>
  <circle cx="135" cy="140" r="62" fill="#7C3AED" opacity="0.16" filter="url(#glow)"/>
  <g transform="translate(72 76)">
    <rect width="128" height="128" rx="32" fill="#0D1117"/>
    <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="31.25" fill="none" stroke="#484F58" stroke-width="1.5"/>
    <rect x="25" y="29" width="78" height="10" rx="5" fill="#F0F6FC"/>
    <rect x="25" y="94" width="78" height="10" rx="5" fill="#F0F6FC"/>
    <circle cx="64" cy="57" r="8" fill="url(#accent)"/>
    <path d="M69 69c0 8-5 12-13 15" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="228" y="132" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="750" letter-spacing="-2">TL;PR</text>
  <text x="230" y="164" fill="#8B949E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="500">Long threads, folded</text>
</svg>
